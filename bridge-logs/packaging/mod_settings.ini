[Mod]
Id=UE4SSLuaLogBridge
Name=UE4SS Lua Log Bridge
ConfigSection=UE4SSLuaEXtensions.Logs

[Setting.GlobalLevel]
Id=GlobalLevel
Type=picker
Label=Global log level
Description=The level every mod logs at unless its own level is set: lines below it are not written. Each mod listed below, and each of its categories, can set its own level or Inherit (stored in config.ini under [Levels]). Takes effect at once.
Group=Levels
PresetValues=1|2|3|4|5|6|7
PresetLabels=Trace|Debug|Info|Warn|Error|Critical|Off
Default=4

[Setting.EnableVerifications]
Id=EnableVerifications
Type=toggle
Label=Enable load-time verifications
Description=Runs the bridge's in-game checks when the game loads and writes PASS and FAIL lines to UE4SS.log. Takes effect on the next launch.
Group=Diagnostics
PresetValues=0|1
PresetLabels=Off|On
Default=0
