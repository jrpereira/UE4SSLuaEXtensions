[Mod]
Id=UE4SSLuaEventBridge
Name=UE4SS Lua Event Bridge
ConfigSection=UE4SSLuaEXtensions.Events

[Setting.EnableVerifications]
Id=EnableVerifications
Type=toggle
Label=Enable load-time verifications
Description=Runs the bridge's in-game checks when the game loads and writes PASS and FAIL lines to UE4SS.log. Takes effect on the next launch.
Group=Diagnostics
PresetValues=0|1
PresetLabels=Off|On
Default=0

[Setting.EnableHooks]
Id=EnableHooks
Type=toggle
Label=Enable function hooks
Description=Lets Lua mods hook game functions through the bridge (Hooks.Install and Hooks.Request). Nothing is patched until a mod asks for a hook; off refuses every hook. Takes effect on the next launch.
Group=Features
PresetValues=0|1
PresetLabels=Off|On
Default=1
