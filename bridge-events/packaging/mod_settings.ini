[Mod]
Id=UE4SSLuaEventBridge
Name=UE4SS Lua Event Bridge

[Setting.LoadTimeVerifications]
Id=LoadTimeVerifications
Type=toggle
Label=Enable load-time verifications
Description=Runs the bridge's in-game checks when the game loads and writes PASS and FAIL lines to UE4SS.log. Takes effect on the next launch.
Group=Diagnostics
PresetValues=0|1
PresetLabels=Off|On
Default=0
ConfigFile=settings.ini
ConfigSection=Verifications
ConfigKey=LoadTime

[Setting.FunctionHooks]
Id=FunctionHooks
Type=toggle
Label=Enable function hooks
Description=Lets Lua mods hook game functions through the bridge (Hooks.Hook). Nothing is patched until a mod asks for a hook; off refuses every hook. Takes effect the next time Lua mods start.
Group=Features
PresetValues=0|1
PresetLabels=Off|On
Default=1
ConfigFile=settings.ini
ConfigSection=Hooks
ConfigKey=Enabled
