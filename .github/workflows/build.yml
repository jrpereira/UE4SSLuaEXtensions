name: build

on:
  push:
    branches:
      - "**"
      - "!release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m unittest discover -s tests -p test_release_notes.py -v
      - run: bash tests/run.sh

  windows-dll:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Release tooling tests
        # Metadata tests need PowerShell only, not the compiler.
        run: |
          ./tests/ReleaseMetadataTests.ps1
          ./tests/PackageReleaseTests.ps1
      - name: Native lifecycle tests and build
        shell: pwsh
        run: ./tools/ci-windows-native.ps1
      # One verify-and-package step per product; a product runs only once its folder exists.
      - name: Verify and package bridge-events
        id: bridge-events
        if: hashFiles('bridge-events/CMakeLists.txt') != ''
        shell: pwsh
        run: ./tools/ci-package-product.ps1 -Product bridge-events -SourceCommit $env:GITHUB_SHA -OutputFile $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.bridge-events.outcome == 'success'
        with:
          name: ${{ steps.bridge-events.outputs.artifact }}
          path: |
            ${{ steps.bridge-events.outputs.archive }}
            ${{ steps.bridge-events.outputs.archive }}.manifest.json
            ${{ steps.bridge-events.outputs.archive }}.sha256
      - name: Verify and package bridge-files
        id: bridge-files
        if: hashFiles('bridge-files/CMakeLists.txt') != ''
        shell: pwsh
        run: ./tools/ci-package-product.ps1 -Product bridge-files -SourceCommit $env:GITHUB_SHA -OutputFile $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.bridge-files.outcome == 'success'
        with:
          name: ${{ steps.bridge-files.outputs.artifact }}
          path: |
            ${{ steps.bridge-files.outputs.archive }}
            ${{ steps.bridge-files.outputs.archive }}.manifest.json
            ${{ steps.bridge-files.outputs.archive }}.sha256
