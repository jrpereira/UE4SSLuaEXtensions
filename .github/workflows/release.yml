name: release

# Each product releases from its own branch: release/<product>/v<version> publishes
# tag <product>/v<version>. Legacy release/v* branches no longer publish.
on:
  push:
    branches:
      - "release/bridge-events/v*"
      - "release/bridge-files/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m unittest discover -s tests -p test_release_notes.py -v
      - run: bash tests/run.sh

  windows-release:
    needs: [portable-tests, repository-hygiene]
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version
        shell: pwsh
        run: |
          & ./tests/ReleaseMetadataTests.ps1
          & ./tests/PackageReleaseTests.ps1
          if ($env:GITHUB_REF_TYPE -ne 'branch') { throw 'Release must run on its versioned branch' }
          if ($env:GITHUB_REF_NAME -notmatch '^release/(bridge-[a-z]+)/v') { throw 'Release must run on release/<product>/v<version>' }
          $product = $Matches[1]
          $metadata = & ./tools/release-metadata.ps1 -Product $product -ReleaseRef $env:GITHUB_REF_NAME
          "RELEASE_PRODUCT=$product" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRODUCT_NAME=$($metadata.product_name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($metadata.version)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$($metadata.tag)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ARCHIVE=$($metadata.archive)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$($metadata.prerelease)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_SHA=$env:GITHUB_SHA" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native lifecycle tests and build
        shell: pwsh
        run: ./tools/ci-windows-native.ps1
      - name: Verify DLL versions, package and checksum
        shell: pwsh
        run: ./tools/ci-package-product.ps1 -Product $env:RELEASE_PRODUCT -ReleaseRef $env:GITHUB_REF_NAME -SourceCommit $env:RELEASE_TARGET_SHA
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.RELEASE_ARCHIVE }}
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          python tools/release_notes.py --changelog "$env:RELEASE_PRODUCT/CHANGELOG.md" --tag "v$env:RELEASE_VERSION" --output $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $refs = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE) { throw 'Cannot verify existing release tag' }
          & ./tools/test-release-tag.ps1 -RemoteRefs $refs -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_TARGET_SHA
          # Releases of different products share one repository, so none is marked Latest.
          $arguments = @(
              "release", "create", $env:RELEASE_TAG,
              $env:RELEASE_ARCHIVE,
              "$($env:RELEASE_ARCHIVE).sha256",
              "$($env:RELEASE_ARCHIVE).manifest.json",
              "--target", $env:RELEASE_TARGET_SHA,
              "--title", "$env:RELEASE_PRODUCT_NAME v$env:RELEASE_VERSION",
              "--latest=false"
          )
          $arguments += @("--notes-file", $notes)
          if ($env:RELEASE_PRERELEASE -eq 'True') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
